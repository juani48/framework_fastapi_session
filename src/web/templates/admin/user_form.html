{% extends "layout.html" %}

{% block title %}Panel de Administración - Mi Sitio{% endblock %}

{% block content %}
<div class="hero">
    <h1>Bienvenido al Panel de Administración</h1>
    <form action="/admin/add-user" method="post">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="last_name">Apellido:</label>
        <input type="text" id="last_name" name="last_name" required>
        <br>
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="weight">Peso:</label>
        <input type="number" id="weight" name="weight" required>
        <br>
        <label for="height">Altura:</label>
        <input type="number" id="height" name="height" required>
        <br>
        <label for="birthdate">Cumpleaños:</label>
        <input type="date" id="birthdate" name="birthdate" required>
        <br>
        <label for="role">Rol:</label>
        <select id="role" name="role" required></select>
        <br><br>

        <button type="submit">Agregar Usuario</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        fetch('/admin/role-list')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error en la respuesta del servidor');
                }
                return response.json();
            })
            .then(data => {
                const roleSelect = document.getElementById('role');
                console.log(data);
                if (data.roles.length === 0) {
                    roleSelect.innerHTML = '<option>No hay roles disponibles.</option>';
                } else {
                    data.roles.forEach(role => {
                        const option = document.createElement('option');
                        option.value = role.id;
                        option.textContent = role.name;
                        roleSelect.appendChild(option);
                    });
                }
            })
            .catch(error => {
                alert('Error al cargar los roles:', error);
                window.location.href = '{{ url_for("render_admin_form_users") }}';
            });
    });

    document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault(); 
        const form = e.target;
        const formData = new FormData(form);

        const data = {
            name: formData.get('name'),
            last_name: formData.get('last_name'),
            email: formData.get('email'),
            weight: parseFloat(formData.get('weight')),
            height: parseFloat(formData.get('height')),
            birthdate: formData.get('birthdate'),
            role: formData.get('role')
        };

        const response = await fetch(form.action, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('Usuario agregado exitosamente');
            window.location.href = '{{ url_for("render_admin_dashboard") }}';
        } else {
            alert((await response.text()));
            return;
        }
    });

</script>
{% endblock %}
